[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntg-llm"
version = "0.1.0"
description = "Provider-neutral structured completions with persistent round-robin routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm==1.98.0",
    "python-dotenv>=1.0,<2",
    "pydantic>=2,<3",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
agent = ["langchain-core", "langchain-classic", "langchain-mcp-adapters"]

[tool.setuptools.packages.find]
include = ["ntg_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

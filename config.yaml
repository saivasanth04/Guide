mcp:
  enabled: true
  servers:
    desktop-commander:
      transport: stdio
      command: cmd
      args:
        - /d
        - /c
        - npx
        - -y
        - '@wonderwhy-er/desktop-commander@0.3.1'
        - --no-onboarding
      tool_timeout: 130s
    web-search:
      transport: stdio
      command: cmd
      args:
        - /d
        - /c
        - npx
        - -y
        - duckduckgo-websearch
      tool_timeout: 60s
